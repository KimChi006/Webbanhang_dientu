<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giỏ hàng & đơn hàng | TechStore</title>
  <style>
    :root{--blue:#1769d2;--blue-dark:#0f4fa8;--ink:#172033;--muted:#68758a;--line:#e5eaf2;--bg:#f5f7fb;--green:#16803d;--red:#c73535;--radius:16px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:var(--blue);text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.nav{max-width:1180px;margin:auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{font-size:25px;font-weight:850;letter-spacing:-1px;color:#14233b}.logo span{color:var(--blue)}.navlinks{display:flex;align-items:center;gap:18px}.navlinks a{color:#475569;font-weight:650}.navright{display:flex;align-items:center;gap:10px}.account-label{color:var(--muted);font-size:13px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 15px;font-weight:750;transition:.15s}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-dark)}.btn-light{background:#fff;border-color:#d9e1ed;color:#24344d}.btn-light:hover{background:#f0f5ff}.btn-danger{background:#fff2f2;color:var(--red);border-color:#ffd5d5}.btn-small{padding:7px 10px;font-size:13px}.main{max-width:1180px;margin:30px auto 64px;padding:0 22px}.page-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:23px}.eyebrow{color:var(--blue);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;font-weight:850}.page-heading h1{font-size:clamp(27px,4vw,36px);letter-spacing:-1px;margin:5px 0}.page-heading p{color:var(--muted);margin:0}.tabs{display:flex;gap:8px;background:#eaf0f8;border-radius:13px;padding:5px;margin:0 0 20px;max-width:max-content}.tab{border:0;background:transparent;color:#526076;padding:10px 17px;border-radius:9px;font-weight:750}.tab.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px #15294a12}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.8fr);gap:20px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 5px 20px #15294a06;overflow:hidden}.panel-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h2{margin:0;font-size:18px}.panel-body{padding:20px 22px}.muted{color:var(--muted)}.cart-item{display:grid;grid-template-columns:94px minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid #edf0f5}.cart-item:first-child{padding-top:0}.cart-item:last-child{border-bottom:0;padding-bottom:0}.item-image{width:94px;height:94px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.item-image img{width:100%;height:100%;object-fit:contain}.item-name{font-weight:800;margin:0 0 5px}.item-meta{font-size:13px;color:var(--muted)}.item-price{color:var(--blue);font-weight:850;margin-top:6px}.item-controls{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}.qty-control{display:inline-flex;align-items:center;border:1px solid #d9e1ed;border-radius:9px;overflow:hidden}.qty-control button{height:32px;width:32px;border:0;background:#f6f8fc;font-weight:800}.qty-control input{width:42px;height:32px;text-align:center;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);outline:none}.item-subtotal{text-align:right;font-weight:850;white-space:nowrap}.summary-panel{position:sticky;top:90px}.summary-row{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:12px 0;color:#475569}.summary-row.total{padding-top:16px;border-top:1px solid var(--line);margin-top:18px;color:var(--ink);font-weight:800}.summary-row.total strong{color:var(--blue);font-size:23px}.summary-panel .btn-primary{width:100%;margin-top:12px}.hint{background:#f0f6ff;border:1px solid #d6e7ff;padding:12px 14px;border-radius:11px;color:#38557d;font-size:13px;margin-top:16px}.empty{text-align:center;padding:50px 22px}.empty-icon{font-size:43px;margin-bottom:12px}.empty h3{margin:0 0 6px;font-size:20px}.empty p{color:var(--muted);margin:0 auto 20px;max-width:440px}.notice{padding:13px 15px;border-radius:11px;margin-bottom:18px;background:#f0f6ff;color:#31537e;border:1px solid #d4e5ff}.notice.error{background:#fff3f3;color:#a92323;border-color:#ffd5d5}.notice.success{background:#edf9f0;color:#176d34;border-color:#c9efd3}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-weight:750;font-size:13px;color:#34445c}.field input,.field select,.field textarea{width:100%;border:1px solid #d7dfeb;border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1769d21a}.field textarea{min-height:88px;resize:vertical}.radio-options{display:grid;gap:9px}.radio-card{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:13px;cursor:pointer}.radio-card:has(input:checked){border-color:#8bb7f3;background:#f4f8ff}.radio-card input{margin-top:4px;accent-color:var(--blue)}.radio-card strong{display:block}.radio-card small{display:block;color:var(--muted);margin-top:2px}.checkout-actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.order-list{display:grid;gap:14px}.order-card{border:1px solid var(--line);border-radius:13px;padding:17px 18px;background:#fff}.order-card-top{display:flex;justify-content:space-between;align-items:start;gap:16px;flex-wrap:wrap}.order-id{font-weight:850;font-size:16px}.order-date{font-size:13px;color:var(--muted);margin-top:3px}.order-total{font-size:18px;color:var(--blue);font-weight:850}.status{display:inline-flex;padding:5px 10px;border-radius:100px;font-size:12px;font-weight:800;background:#eaf2ff;color:#245ca8}.status.processed{background:#fff5df;color:#946000}.status.delivered{background:#e9f8ee;color:#16733b}.status.cancelled{background:#fff0f0;color:#b52d2d}.order-card-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #edf0f5;margin-top:14px;padding-top:13px;flex-wrap:wrap}.order-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}.detail-cell{border:1px solid #edf0f5;border-radius:10px;padding:12px}.detail-cell span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.detail-cell strong{overflow-wrap:anywhere}.detail-table{width:100%;border-collapse:collapse}.detail-table th,.detail-table td{text-align:left;padding:12px 8px;border-bottom:1px solid #edf0f5}.detail-table th{font-size:12px;color:var(--muted);font-weight:800}.detail-table td:last-child,.detail-table th:last-child{text-align:right;white-space:nowrap}.success-wrap{text-align:center;padding:44px 22px}.success-icon{width:66px;height:66px;display:grid;place-items:center;border-radius:50%;margin:0 auto 17px;background:#e9f8ee;color:#16803d;font-size:34px}.success-wrap h2{font-size:27px;margin:0 0 8px}.success-wrap p{color:var(--muted);margin:0 0 20px}.footer{text-align:center;color:#7b8798;font-size:13px;padding:25px;border-top:1px solid var(--line);background:#fff}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.summary-panel{position:static}.page-heading{align-items:start;flex-direction:column}.nav{padding:13px 16px}.main{padding:0 15px;margin-top:22px}.navlinks{gap:10px}.account-label{display:none}}
    @media(max-width:560px){.navlinks{display:none}.logo{font-size:22px}.btn{padding:9px 11px}.panel-head,.panel-body{padding:16px}.cart-item{grid-template-columns:74px minmax(0,1fr);gap:12px}.item-image{width:74px;height:74px}.item-subtotal{grid-column:2;text-align:left}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.order-detail-grid{grid-template-columns:1fr}.tabs{max-width:100%;width:100%}.tab{flex:1;padding:9px 7px;font-size:13px}.checkout-actions{flex-direction:column-reverse}.checkout-actions .btn{width:100%}}
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="nav">
      <a class="logo" href="index.html">Tech<span>Store.</span></a>
      <div class="navlinks"><a href="index.html">Trang chủ</a><a href="index.html#san-pham">Tiếp tục mua sắm</a></div>
      <div class="navright"><span class="account-label" id="accountName">Đang kiểm tra tài khoản…</span><a class="btn btn-light" href="index.html?login=1">Tài khoản</a></div>
    </nav>
  </header>
  <main class="main">
    <div class="page-heading"><div><div class="eyebrow">Mua sắm cùng TechStore</div><h1 id="pageTitle">Giỏ hàng của bạn</h1><p id="pageDescription">Kiểm tra sản phẩm trước khi đặt hàng.</p></div></div>
    <div id="globalMessage" hidden></div>
    <div class="tabs" id="mainTabs" role="tablist" aria-label="Giỏ hàng và lịch sử mua hàng">
      <button class="tab active" data-view="cart" type="button">🛒 Giỏ hàng</button>
      <button class="tab" data-view="history" type="button">📦 Lịch sử mua</button>
    </div>
    <section id="viewRoot" aria-live="polite"><div class="panel empty"><p>Đang tải dữ liệu…</p></div></section>
  </main>
  <footer class="footer">© 2026 TechStore · Đơn hàng được lưu trong dữ liệu trình duyệt của website demo.</footer>
  <script src="products.js"></script>
  <script src="admin/js/store.js"></script>
  <script>
  (() => {
    "use strict";
    const CART_KEY = "techstore_customer_carts_v1";
    const LOCAL_DEMO_MODE = window.location.protocol === "file:";
    const DEMO_ACCOUNT_KEY = "techstore_demo_current_account_v1";
    let incomingState = null;
    try {
      if (window.location.hash.startsWith("#tv4=")) {
        incomingState = JSON.parse(decodeURIComponent(window.location.hash.slice(5)));
      }
    } catch (error) { console.warn("Không đọc được trạng thái chuyển trang:", error); }
    const $ = (s, root = document) => root.querySelector(s);
    const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));
    const money = value => (Number(value) || 0).toLocaleString("vi-VN") + " ₫";
    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
    const normalize = value => String(value ?? "").normalize("NFD").toLowerCase().replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").trim();
    let account = null, profile = {}, db = null, view = "cart", selectedOrderId = null, justPlacedOrder = null;
    const viewRoot = $("#viewRoot");

    function getCarts() {
      try { const value = JSON.parse(localStorage.getItem(CART_KEY) || "{}"); return value && typeof value === "object" ? value : {}; }
      catch { return {}; }
    }
    function saveCarts(value) { localStorage.setItem(CART_KEY, JSON.stringify(value)); }
    function accountKey() { return String(account?.maKH ?? account?.MaTaiKhoan ?? ""); }
    function getCart() { if (!accountKey()) return []; return getCarts()[accountKey()] || []; }
    function setCart(items) { const carts = getCarts(); carts[accountKey()] = items; saveCarts(carts); updateCartBadge(); }
    function readStoredAccount() {
      try { return JSON.parse(localStorage.getItem(DEMO_ACCOUNT_KEY) || "null"); } catch (_) { return null; }
    }
    function transferURL(target) {
      const payload = {
        v: 1,
        account,
        profile: profile || {},
        cart: account ? getCart() : [],
        db: db ? JSON.parse(JSON.stringify(db)) : null
      };
      if (payload.db && account) {
        payload.db.demoCurrentAccount = account;
        payload.db.demoCurrentProfile = profile || {};
      }
      return target + "#tv4=" + encodeURIComponent(JSON.stringify(payload));
    }
    function adminSnapshotURL() {
      if (!LOCAL_DEMO_MODE || !db) return "admin/index.html";
      const snapshot = JSON.parse(JSON.stringify(db));
      if (account) {
        snapshot.demoCurrentAccount = account;
        snapshot.demoCurrentProfile = profile || {};
      }
      return "admin/index.html#tv4db=" + encodeURIComponent(JSON.stringify(snapshot));
    }
    function updateCartBadge() {
      const name = account ? (account.hoTen || account.email || "Tài khoản") : "Chưa đăng nhập";
      $("#accountName").textContent = name;
      const tab = $('[data-view="cart"]');
      const count = getCart().reduce((sum, item) => sum + Number(item.quantity || 0), 0);
      tab.textContent = `🛒 Giỏ hàng${count ? ` (${count})` : ""}`;
    }
    function showMessage(message, type = "notice") {
      const node = $("#globalMessage"); node.hidden = false; node.className = `notice ${type === "error" ? "error" : type === "success" ? "success" : ""}`; node.textContent = message;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function clearMessage() { const node = $("#globalMessage"); node.hidden = true; node.textContent = ""; }
    function statusLabel(status) { return ({new:"Mới đặt",processed:"Đã xử lý",delivered:"Đã giao",cancelled:"Đã hủy"})[status] || status || "Không rõ"; }
    function statusClass(status) { return ({new:"",processed:"processed",delivered:"delivered",cancelled:"cancelled"})[status] || ""; }
    function imageFor(item) { const img = String(item.image || item.img || ""); return img || ""; }
    function total(items) { return items.reduce((sum, item) => sum + Number(item.price || 0) * Number(item.quantity || 0), 0); }
    function refreshDb() { db = window.TechStore.load(typeof list_products !== "undefined" && Array.isArray(list_products) ? list_products : []); return db; }
    function renderLoginRequired() {
      $("#pageTitle").textContent = "Đăng nhập để mua hàng";
      $("#pageDescription").textContent = "Giỏ hàng và lịch sử mua được gắn với tài khoản khách hàng.";
      $("#mainTabs").hidden = true;
      viewRoot.innerHTML = `<div class="panel empty"><div class="empty-icon">🔐</div><h3>Bạn chưa đăng nhập</h3><p>Vui lòng đăng nhập tài khoản khách hàng trước khi sử dụng giỏ hàng, đặt hàng hoặc xem lịch sử mua.</p><a class="btn btn-primary" href="index.html?login=1">Đăng nhập ngay</a></div>`;
    }
    async function fetchJson(url) {
      const response = await fetch(url, { credentials: "same-origin", headers: { "Accept": "application/json" } });
      let result = {}; try { result = await response.json(); } catch {}
      if (!response.ok) throw new Error(result.message || "Không thể tải dữ liệu.");
      return result;
    }
    async function bootstrap() {
      if (LOCAL_DEMO_MODE) {
        try {
          // Hash transfer là cầu nối giữa các file file:// trong Chrome/Firefox,
          // nơi localStorage có thể bị tách theo từng file.
          if (incomingState?.db && incomingState.db.schema === 2 && Array.isArray(incomingState.db.orders)) {
            localStorage.setItem(window.TechStore.KEY, JSON.stringify(incomingState.db));
          }
          account = incomingState?.account || readStoredAccount();
          profile = incomingState?.profile || (account ? {
            hoTen: account.hoTen || "",
            email: account.email || "",
            soDienThoai: account.soDienThoai || "",
            ngaySinh: account.ngaySinh || "",
            diaChi: account.diaChi || ""
          } : {});
          if (account && Array.isArray(incomingState?.cart)) {
            const carts = getCarts();
            carts[String(account.maKH ?? account.MaTaiKhoan ?? account.id)] = incomingState.cart;
            saveCarts(carts);
          }
          refreshDb();
          if (account) {
            db.demoCurrentAccount = account;
            db.demoCurrentProfile = profile;
            window.TechStore.save(db);
            try { localStorage.setItem(DEMO_ACCOUNT_KEY, JSON.stringify(account)); } catch (_) {}
            updateCartBadge();
            render();
          } else {
            updateCartBadge();
            renderLoginRequired();
          }
        } catch (error) {
          viewRoot.innerHTML = `<div class="panel empty"><h3>Không đọc được dữ liệu prototype</h3><p>${esc(error.message)}</p><a class="btn btn-primary" href="index.html">Quay lại trang chủ</a></div>`;
        }
        return;
      }
      try {
        refreshDb();
      } catch (error) {
        viewRoot.innerHTML = `<div class="panel empty"><h3>Không đọc được dữ liệu đơn hàng</h3><p>${esc(error.message)}</p></div>`;
        return;
      }
      try {
        const current = await fetchJson("/api/me");
        account = current.account;
        try { const result = await fetchJson("/api/profile"); profile = result.profile || {}; }
        catch (error) { console.warn("Chưa tải được hồ sơ khách hàng:", error.message); profile = {}; }
        updateCartBadge();
        render();
      } catch (error) {
        account = null;
        updateCartBadge();
        renderLoginRequired();
      }
    }
    function setView(next) {
      view = next; selectedOrderId = null; clearMessage();
      $("#mainTabs").hidden = !["cart", "history"].includes(next);
      $$(".tab").forEach(tab => tab.classList.toggle("active", tab.dataset.view === next));
      render();
    }
    function setPageHeading(title, description) { $("#pageTitle").textContent = title; $("#pageDescription").textContent = description; }
    function render() {
      if (!account) return renderLoginRequired();
      updateCartBadge();
      try { refreshDb(); } catch (error) { showMessage(error.message, "error"); return; }
      if (view === "cart") renderCart();
      else if (view === "checkout") renderCheckout();
      else if (view === "history") renderHistory();
      else if (view === "detail") renderOrderDetail(selectedOrderId);
      else if (view === "success") renderSuccess(justPlacedOrder);
    }
    function renderCart() {
      setPageHeading("Giỏ hàng của bạn", "Kiểm tra sản phẩm, số lượng và tổng tiền trước khi đặt hàng.");
      const cart = getCart();
      if (!cart.length) {
        viewRoot.innerHTML = `<div class="panel empty"><div class="empty-icon">🛒</div><h3>Giỏ hàng đang trống</h3><p>Hãy chọn sản phẩm điện tử bạn yêu thích rồi quay lại đây để đặt hàng.</p><a class="btn btn-primary" href="index.html#san-pham">Khám phá sản phẩm</a></div>`;
        return;
      }
      const cartRows = cart.map((item, index) => `
        <article class="cart-item">
          <div class="item-image">${imageFor(item) ? `<img src="${esc(imageFor(item))}" alt="${esc(item.name)}" onerror="this.style.display='none'">` : "📱"}</div>
          <div>
            <h3 class="item-name">${esc(item.name || "Sản phẩm")}</h3>
            <div class="item-meta">Mã sản phẩm: ${esc(item.productId || "—")}</div>
            <div class="item-price">${money(item.price)}</div>
            <div class="item-controls">
              <div class="qty-control" aria-label="Số lượng">
                <button type="button" data-action="qty-minus" data-index="${index}" aria-label="Giảm số lượng">−</button>
                <input type="number" min="1" max="999" value="${Math.max(1, Number(item.quantity) || 1)}" data-action="qty-input" data-index="${index}" aria-label="Số lượng ${esc(item.name)}">
                <button type="button" data-action="qty-plus" data-index="${index}" aria-label="Tăng số lượng">+</button>
              </div>
              <button type="button" class="btn btn-danger btn-small" data-action="remove" data-index="${index}">Xóa</button>
            </div>
          </div>
          <div class="item-subtotal">${money(Number(item.price) * Number(item.quantity))}</div>
        </article>`).join("");
      viewRoot.innerHTML = `<div class="layout"><section class="panel"><div class="panel-head"><h2>Sản phẩm đã chọn</h2><span class="muted">${cart.length} mặt hàng</span></div><div class="panel-body">${cartRows}</div></section><aside class="panel summary-panel"><div class="panel-head"><h2>Tóm tắt đơn hàng</h2></div><div class="panel-body"><div class="summary-row"><span>Số lượng sản phẩm</span><strong>${cart.reduce((sum, item) => sum + Number(item.quantity), 0)}</strong></div><div class="summary-row"><span>Phí giao hàng</span><strong>Miễn phí</strong></div><div class="summary-row total"><span>Tạm tính</span><strong>${money(total(cart))}</strong></div><button type="button" class="btn btn-primary" data-action="checkout">Tiến hành đặt hàng →</button><div class="hint">Đơn hàng sẽ được tạo ở trạng thái <strong>Mới đặt</strong>. Thanh toán trực tuyến/chuyển khoản trong bản demo chỉ mô phỏng thao tác, chưa trừ tiền thật.</div></div></aside></div>`;
    }
    function renderCheckout() {
      setPageHeading("Thông tin đặt hàng", "Nhập thông tin người nhận và xác nhận phương thức thanh toán.");
      const cart = getCart();
      if (!cart.length) { view = "cart"; renderCart(); return; }
      const hasProfileAddress = String(profile.diaChi || "").trim().length > 0;
      viewRoot.innerHTML = `<div class="layout"><section class="panel"><div class="panel-head"><h2>Thông tin giao hàng</h2><span class="muted">Thông tin có thể thay đổi cho đơn này</span></div><div class="panel-body"><form id="checkoutForm"><div class="form-grid"><div class="field"><label for="recipient">Họ tên người nhận *</label><input id="recipient" name="recipient" required maxlength="100" value="${esc(profile.hoTen || account.hoTen || "")}" autocomplete="name"></div><div class="field"><label for="phone">Số điện thoại *</label><input id="phone" name="phone" required maxlength="20" pattern="[0-9+() .-]{9,20}" value="${esc(profile.soDienThoai || "")}" autocomplete="tel" placeholder="0901234567"></div><div class="field full"><label for="addressMode">Địa chỉ giao hàng *</label><select name="addressMode" id="addressMode"><option value="profile" ${hasProfileAddress ? "" : "disabled"}>Dùng địa chỉ trong tài khoản${hasProfileAddress ? ` — ${esc(profile.diaChi)}` : " (chưa cập nhật)"}</option><option value="new" ${hasProfileAddress ? "" : "selected"}>Nhập địa chỉ giao hàng mới</option></select></div><div class="field full" id="newAddressField" ${hasProfileAddress ? "hidden" : ""}><label for="newAddress">Địa chỉ nhận hàng *</label><textarea id="newAddress" name="newAddress" maxlength="300" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố">${esc(profile.diaChi || "")}</textarea></div><div class="field full"><label for="note">Ghi chú (không bắt buộc)</label><textarea id="note" name="note" maxlength="500" placeholder="Ví dụ: giao giờ hành chính, gọi trước khi giao"></textarea></div><div class="field full"><label>Phương thức thanh toán *</label><div class="radio-options"><label class="radio-card"><input type="radio" name="payment" value="Tiền mặt khi nhận hàng" checked><span><strong>Tiền mặt khi nhận hàng (COD)</strong><small>Thanh toán cho nhân viên giao hàng khi nhận sản phẩm.</small></span></label><label class="radio-card"><input type="radio" name="payment" value="Chuyển khoản ngân hàng (mô phỏng)"><span><strong>Chuyển khoản ngân hàng</strong><small>Demo: hệ thống ghi nhận lựa chọn, chưa phát sinh giao dịch thật.</small></span></label><label class="radio-card"><input type="radio" name="payment" value="Thanh toán trực tuyến (mô phỏng)"><span><strong>Thanh toán trực tuyến</strong><small>Demo giao diện, chưa kết nối cổng thanh toán.</small></span></label></div></div></div><div id="checkoutError" class="notice error" hidden></div><div class="checkout-actions"><button type="button" class="btn btn-light" data-action="back-cart">← Quay lại giỏ hàng</button><button type="submit" id="placeOrderBtn" class="btn btn-primary">Xác nhận đặt hàng</button></div></form></div></section><aside class="panel summary-panel"><div class="panel-head"><h2>Đơn hàng của bạn</h2></div><div class="panel-body">${cart.map(item => `<div class="summary-row"><span>${esc(item.name)} × ${Number(item.quantity)}</span><strong>${money(Number(item.price) * Number(item.quantity))}</strong></div>`).join("")}<div class="summary-row"><span>Phí giao hàng</span><strong>Miễn phí</strong></div><div class="summary-row total"><span>Tổng thanh toán</span><strong>${money(total(cart))}</strong></div><div class="hint">Khi xác nhận, đơn sẽ được lưu vào lịch sử mua của tài khoản và xuất hiện trong trang quản lý đơn hàng của admin trên cùng trình duyệt/domain.</div></div></aside></div>`;
      const mode = $("#addressMode"), addressField = $("#newAddressField"), address = $("#newAddress");
      function syncAddress() { const custom = mode.value === "new"; addressField.hidden = !custom; address.required = custom; }
      mode.addEventListener("change", syncAddress); syncAddress();
      $("#checkoutForm").addEventListener("submit", submitOrder);
    }
    function resolveAdminProductId(item, database) {
      const match = database.products.find(p => String(p.masp) === String(item.productId)) || database.products.find(p => normalize(p.name) === normalize(item.name));
      return match?.masp || item.productId;
    }
    function submitOrder(event) {
      event.preventDefault();
      const form = event.currentTarget, data = new FormData(form);
      const errorNode = $("#checkoutError"), submit = $("#placeOrderBtn");
      errorNode.hidden = true;
      const recipient = String(data.get("recipient") || "").trim();
      const phone = String(data.get("phone") || "").trim();
      const address = data.get("addressMode") === "profile" ? String(profile.diaChi || "").trim() : String(data.get("newAddress") || "").trim();
      const note = String(data.get("note") || "").trim();
      if (!recipient || recipient.length > 100) return fail("Vui lòng nhập họ tên người nhận hợp lệ.");
      if (!/^[0-9+() .-]{9,20}$/.test(phone)) return fail("Số điện thoại không hợp lệ (9–20 ký tự số hoặc dấu +, (), dấu chấm, dấu cách, gạch ngang).");
      if (!address || address.length > 300) return fail("Vui lòng chọn địa chỉ trong tài khoản hoặc nhập địa chỉ giao hàng (tối đa 300 ký tự).");
      if (!getCart().length) return fail("Giỏ hàng đang trống, không thể đặt hàng.");
      if (note.length > 500) return fail("Ghi chú không được vượt quá 500 ký tự.");
      submit.disabled = true; submit.textContent = "Đang tạo đơn hàng…";
      try {
        const cart = getCart();
        const items = cart.map(item => {
          const productId = resolveAdminProductId(item, db);
          const product = db.products.find(p => String(p.masp) === String(productId));
          if (!product) throw new Error(`Không tìm thấy sản phẩm “${item.name}” trong dữ liệu quản trị. Hãy đồng bộ mã sản phẩm trước khi đặt hàng.`);
          const qty = Number(item.quantity), price = Number(item.price);
          if (!Number.isSafeInteger(qty) || qty < 1 || qty > 999) throw new Error("Số lượng sản phẩm không hợp lệ.");
          if (!Number.isFinite(price) || price < 0) throw new Error("Giá sản phẩm không hợp lệ.");
          if (window.TechStore.stock(db, productId) < qty) throw new Error(`Tồn kho không đủ cho “${product.name}”. Vui lòng giảm số lượng hoặc liên hệ cửa hàng.`);
          return { productId, name: product.name || item.name, quantity: qty, price };
        });
        const order = {
          id: window.TechStore.uid("DH"),
          customerId: accountKey(),
          createdAt: window.TechStore.now(),
          status: "new",
          address,
          recipient,
          phone,
          payment: String(data.get("payment") || "Tiền mặt khi nhận hàng"),
          note,
          items
        };
        // Cập nhật cùng cấu trúc dữ liệu mà trang Admin đang sử dụng.
        db = window.TechStore.transact(db, state => { state.orders.unshift(order); });
        justPlacedOrder = order;
        const carts = getCarts(); carts[accountKey()] = []; saveCarts(carts);
        view = "success"; selectedOrderId = null; clearMessage(); render();
      } catch (error) {
        errorNode.textContent = error.message || "Không thể tạo đơn hàng."; errorNode.hidden = false;
        submit.disabled = false; submit.textContent = "Xác nhận đặt hàng";
      }
      function fail(message) { errorNode.textContent = message; errorNode.hidden = false; }
    }
    function renderHistory() {
      setPageHeading("Lịch sử mua hàng", "Theo dõi các đơn hàng được tạo bằng tài khoản hiện tại.");
      const orders = (refreshDb().orders || []).filter(order => String(order.customerId) === accountKey()).sort((a,b) => String(b.createdAt).localeCompare(String(a.createdAt)));
      if (!orders.length) {
        viewRoot.innerHTML = `<div class="panel empty"><div class="empty-icon">📦</div><h3>Bạn chưa có đơn hàng</h3><p>Những đơn hàng đã đặt sẽ xuất hiện tại đây để bạn tiện theo dõi trạng thái.</p><button type="button" class="btn btn-primary" data-action="continue-shopping">Bắt đầu mua sắm</button></div>`;
        return;
      }
      viewRoot.innerHTML = `<section class="order-list">${orders.map(order => `<article class="order-card"><div class="order-card-top"><div><div class="order-id">Mã đơn: ${esc(order.id)}</div><div class="order-date">Đặt lúc ${esc(order.createdAt?.replace("T", " ") || "—")}</div></div><div style="display:grid;gap:8px;justify-items:end"><span class="status ${statusClass(order.status)}">${esc(statusLabel(order.status))}</span><span class="order-total">${money(window.TechStore.total(order))}</span></div></div><div class="order-card-bottom"><span class="muted">${(order.items || []).length} sản phẩm · ${esc(order.payment || "Chưa chọn thanh toán")}</span><button class="btn btn-light btn-small" type="button" data-action="view-order" data-id="${esc(order.id)}">Xem chi tiết →</button></div></article>`).join("")}</section>`;
    }
    function renderOrderDetail(id) {
      const order = refreshDb().orders.find(item => item.id === id && String(item.customerId) === accountKey());
      if (!order) { view = "history"; renderHistory(); showMessage("Không tìm thấy đơn hàng.", "error"); return; }
      setPageHeading("Chi tiết đơn hàng", `Mã đơn ${order.id}`);
      viewRoot.innerHTML = `<section class="panel"><div class="panel-head"><h2>Thông tin đơn hàng</h2><span class="status ${statusClass(order.status)}">${esc(statusLabel(order.status))}</span></div><div class="panel-body"><div class="order-detail-grid"><div class="detail-cell"><span>Người nhận</span><strong>${esc(order.recipient)}</strong></div><div class="detail-cell"><span>Số điện thoại</span><strong>${esc(order.phone)}</strong></div><div class="detail-cell"><span>Địa chỉ giao hàng</span><strong>${esc(order.address)}</strong></div><div class="detail-cell"><span>Phương thức thanh toán</span><strong>${esc(order.payment)}</strong></div><div class="detail-cell"><span>Ngày đặt hàng</span><strong>${esc(order.createdAt?.replace("T", " ") || "—")}</strong></div><div class="detail-cell"><span>Ghi chú</span><strong>${esc(order.note || "Không có")}</strong></div></div><h3>Sản phẩm trong đơn</h3><div style="overflow-x:auto"><table class="detail-table"><thead><tr><th>Sản phẩm</th><th>SL</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead><tbody>${(order.items || []).map(item => `<tr><td>${esc(item.name)}</td><td>${Number(item.quantity)}</td><td>${money(item.price)}</td><td>${money(Number(item.price) * Number(item.quantity))}</td></tr>`).join("")}</tbody></table></div><div class="summary-row total"><span>Tổng thanh toán</span><strong>${money(window.TechStore.total(order))}</strong></div><div class="checkout-actions"><button type="button" class="btn btn-light" data-action="back-history">← Quay lại lịch sử</button>${order.status === "new" ? `<button type="button" class="btn btn-danger" data-action="cancel-order" data-id="${esc(order.id)}">Hủy đơn hàng</button>` : ""}</div><p class="muted" style="font-size:13px;margin-top:15px">Nếu đơn đã được xử lý, vui lòng liên hệ cửa hàng để được hỗ trợ. Đơn đã giao hoặc đã hủy không thể thay đổi.</p></div></section>`;
    }
    function renderSuccess(order) {
      setPageHeading("Đặt hàng thành công", "Cảm ơn bạn đã mua hàng tại TechStore.");
      if (!order) { view = "history"; renderHistory(); return; }
      const adminURL = adminSnapshotURL();
      viewRoot.innerHTML = `<section class="panel success-wrap"><div class="success-icon">✓</div><h2>Đơn hàng đã được ghi nhận!</h2><p>Mã đơn <strong>${esc(order.id)}</strong> · Trạng thái <strong>Mới đặt</strong></p><div style="font-size:27px;font-weight:850;color:var(--blue);margin:12px 0 22px">${money(window.TechStore.total(order))}</div><p>Đơn hàng đã được thêm vào lịch sử mua và dữ liệu quản lý đơn hàng. Với bản file local, bấm nút bên dưới để chuyển dữ liệu sang trang admin.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn btn-light" type="button" data-action="view-order" data-id="${esc(order.id)}">Xem đơn hàng</button><button class="btn btn-primary" type="button" data-action="continue-shopping">Tiếp tục mua sắm</button><a class="btn btn-light" href="${esc(adminURL)}">Mở quản lý đơn hàng (admin)</a></div></section>`;
    }
    function updateQuantity(index, value) {
      const cart = getCart(); if (!cart[index]) return;
      const quantity = Math.max(1, Math.min(999, Math.floor(Number(value) || 1)));
      cart[index].quantity = quantity; setCart(cart); renderCart();
    }
    function handleAction(action, index, id) {
      if (action === "qty-minus" || action === "qty-plus") {
        const cart = getCart(), current = Number(cart[index]?.quantity) || 1;
        updateQuantity(index, current + (action === "qty-plus" ? 1 : -1));
      } else if (action === "qty-input") return;
      else if (action === "remove") {
        const cart = getCart(); cart.splice(index, 1); setCart(cart); renderCart();
      } else if (action === "checkout") { if (!getCart().length) return showMessage("Giỏ hàng đang trống.", "error"); view = "checkout"; clearMessage(); render(); }
      else if (action === "back-cart") setView("cart");
      else if (action === "continue-shopping") { window.location.href = LOCAL_DEMO_MODE ? transferURL("index.html") : "index.html#san-pham"; }
      else if (action === "view-order") { selectedOrderId = id; view = "detail"; clearMessage(); render(); }
      else if (action === "back-history") setView("history");
      else if (action === "cancel-order") cancelOrder(id);
    }
    function cancelOrder(id) {
      const order = refreshDb().orders.find(item => item.id === id && String(item.customerId) === accountKey());
      if (!order || order.status !== "new") return showMessage("Chỉ có thể hủy đơn khi đơn còn ở trạng thái Mới đặt.", "error");
      if (!window.confirm(`Bạn chắc chắn muốn hủy đơn ${id}?`)) return;
      try {
        db = window.TechStore.transact(db, state => {
          const target = state.orders.find(item => item.id === id && String(item.customerId) === accountKey());
          if (!target || target.status !== "new") throw new Error("Trạng thái đơn đã thay đổi; vui lòng tải lại trang.");
          target.status = "cancelled"; target.updatedAt = window.TechStore.now();
        });
        showMessage("Đã hủy đơn hàng.", "success"); renderOrderDetail(id);
      } catch (error) { showMessage(error.message, "error"); }
    }
    document.addEventListener("click", event => {
      const tab = event.target.closest("[data-view]");
      if (tab) return setView(tab.dataset.view);
      const btn = event.target.closest("[data-action]");
      if (btn) handleAction(btn.dataset.action, Number(btn.dataset.index), btn.dataset.id);
    });
    document.addEventListener("change", event => {
      const input = event.target.closest('[data-action="qty-input"]');
      if (input) updateQuantity(Number(input.dataset.index), input.value);
    });
    window.addEventListener("storage", event => {
      if (event.key === window.TechStore.KEY && account) render();
      if (event.key === CART_KEY && account) { updateCartBadge(); if (view === "cart") renderCart(); }
    });
    if (LOCAL_DEMO_MODE) {
      document.querySelectorAll('a[href="index.html"], a[href="index.html#san-pham"], a[href="index.html?login=1"]').forEach(link => {
        const old = link.getAttribute("href") || "index.html";
        link.href = transferURL(old.split("?")[0].split("#")[0]);
      });
    }
    bootstrap();
  })();
  </script>
</body>
</html>
